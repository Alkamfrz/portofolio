<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0e0c"/>
      <stop offset="100%" stop-color="#1e1b14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a05a"/>
      <stop offset="100%" stop-color="#e4b06a"/>
    </linearGradient>
    <linearGradient id="subtle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a05a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d4a05a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle accent wash on left -->
  <rect width="1200" height="630" fill="url(#subtle)"/>

  <!-- Diagonal slash accent -->
  <line x1="900" y1="0" x2="1200" y2="630" stroke="#d4a05a" stroke-width="1" opacity="0.12"/>
  <line x1="950" y1="0" x2="1200" y2="500" stroke="#d4a05a" stroke-width="1" opacity="0.08"/>
  <line x1="1000" y1="0" x2="1200" y2="400" stroke="#d4a05a" stroke-width="1" opacity="0.05"/>

  <!-- Grid lines (faint) -->
  <g stroke="#232019" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Vertical accent bar -->
  <rect x="80" y="210" width="5" height="210" rx="2.5" fill="url(#accent)"/>

  <!-- Name -->
  <text x="112" y="272" font-family="Georgia, 'Instrument Serif', serif" font-size="58" font-weight="400" fill="#ece8e0">Muhammad Alkam Alfariz</text>

  <!-- Role — two lines matching hero energy -->
  <text x="112" y="330" font-family="system-ui, -apple-system, 'DM Sans', sans-serif" font-size="26" fill="#c0b8a8" font-weight="300" letter-spacing="0.3">Systems that stay up.</text>
  <text x="112" y="365" font-family="system-ui, -apple-system, 'DM Sans', sans-serif" font-size="26" fill="#c0b8a8" font-weight="300" letter-spacing="0.3">Clients that succeed.</text>

  <!-- Accent underline under role -->
  <rect x="112" y="382" width="180" height="2" rx="1" fill="#d4a05a" opacity="0.6"/>

  <!-- Domain tag -->
  <text x="112" y="420" font-family="'Courier New', 'DM Mono', monospace" font-size="17" fill="#d4a05a" letter-spacing="1">alkamfrz.id</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#17150f"/>
  <rect x="0" y="590" width="4" height="40" fill="url(#accent)"/>
  <text x="112" y="615" font-family="'Courier New', 'DM Mono', monospace" font-size="13" fill="#5a5248" letter-spacing="0.5">Activation Specialist · Mekari Qontak · Homelab Infrastructure</text>

  <!-- Top right corner mark -->
  <rect x="1140" y="40" width="24" height="24" rx="2" fill="none" stroke="#d4a05a" stroke-width="1.5" opacity="0.4"/>
  <rect x="1148" y="48" width="8" height="8" rx="1" fill="#d4a05a" opacity="0.3"/>
</svg>
