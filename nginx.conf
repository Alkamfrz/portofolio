# Rate limiting for contact API: 5 requests per 15 minutes per IP
# Nginx only supports r/s or r/m. 20r/m allows an average of 5 requests per 15 mins.
limit_req_zone $binary_remote_addr zone=contact:10m rate=20r/m;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/contact {
        limit_req zone=contact burst=5 nodelay;
        proxy_pass http://localhost:3000/api/contact;
    }

    location ~* \.(css|js|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
