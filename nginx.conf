# Rate limiting for contact API: 5 requests per 15 minutes per IP
limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;

# Gzip compression for text-based responses
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  text/xml
  application/json
  application/javascript
  application/xml+rss
  application/atom+xml
  image/svg+xml;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
        expires 1h;
    }

    location /api/contact {
        limit_req zone=contact burst=5 nodelay;
        proxy_pass http://localhost:3000/api/contact;
    }

    location ~* \.(css|js|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
